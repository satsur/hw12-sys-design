apiVersion: v1
kind: Service
metadata:
  name: web-service
  labels:
    app: web
spec:
  type: ClusterIP
  selector:
    app: web
  ports:
    -
      name: http
      port: 8080
      targetPort: 80 # nginx alpine listens on port 80 by default regardless of what's in Dockerfile
      protocol: TCP
