apiVersion: v1
kind: ServiceAccount
metadata:
  name: control-plane
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: control-plane
  namespace: default
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: control-plane
  namespace: default
subjects:
  - kind: ServiceAccount
    name: control-plane
    namespace: default
roleRef:
  kind: Role
  name: control-plane
  apiGroup: rbac.authorization.k8s.io
