apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordle-api
  labels: 
    app: wordle-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: wordle-api
  template:
    metadata: 
      labels:
        app: wordle-api
    spec: 
      containers:
        - name: wordle-api
          image: wordle-api:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            -
              name: WORDLE_PORT
              value: "8080"
            -
              name: WORDLE_ANSWER
              value: "DESKS"
            -
              name: WORDLE_MAX_IN_FLIGHT
              value: "4"
            -
              name: WORDLE_DELAY_MS
              value: "50"
 