<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>System Metrics</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script src="/metrics.js" defer></script>
    <style>
        :root {
            --ink: #17212b;
            --muted: #64727d;
            --line: #dce4e8;
            --paper: #f5f7f6;
            --panel: #ffffff;
            --teal: #007f7b;
            --coral: #d95f59;
            --gold: #d49a32;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            color: var(--ink);
            background: var(--paper);
            font-family: Georgia, "Times New Roman", serif;
        }
        main { width: min(1120px, calc(100% - 32px)); margin: 0 auto; padding: 38px 0 56px; }
        header { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 30px; }
        h1 { margin: 0 0 6px; font-size: clamp(2rem, 5vw, 3.4rem); font-weight: 500; letter-spacing: 0; }
        .intro, .updated { color: var(--muted); font-family: Arial, sans-serif; font-size: .92rem; }
        nav a { color: var(--teal); font-family: Arial, sans-serif; font-weight: 700; text-decoration: none; }
        .status { padding: 12px 16px; border-left: 4px solid var(--teal); background: #e7f2ef; font-family: Arial, sans-serif; }
        .status.stale { border-color: var(--gold); background: #fff4dc; }
        .status.error { border-color: var(--coral); background: #fbe9e7; }
        .cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 20px 0; }
        .card, .chart-panel, .events { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
        .card { padding: 18px; }
        .card-label { color: var(--muted); font: 700 .72rem/1.2 Arial, sans-serif; letter-spacing: .06em; text-transform: uppercase; }
        .card-value { display: block; margin-top: 10px; font: 700 1.8rem/1 Arial, sans-serif; }
        .grid { display: grid; grid-template-columns: 1.35fr 1fr; gap: 16px; }
        .chart-panel, .events { padding: 18px; }
        h2 { margin: 0 0 14px; font-size: 1.15rem; font-weight: 600; }
        .chart-wrap { height: 280px; position: relative; }
        #event-list { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; font-family: Arial, sans-serif; }
        #event-list li { border-top: 1px solid var(--line); padding-top: 10px; font-size: .86rem; }
        .event-time { color: var(--muted); display: block; font-size: .74rem; margin-bottom: 3px; }
        .empty { color: var(--muted); font-family: Arial, sans-serif; font-size: .9rem; }
        @media (max-width: 760px) {
            header { align-items: start; flex-direction: column; }
            .cards, .grid { grid-template-columns: 1fr 1fr; }
            .grid { display: grid; }
        }
        @media (max-width: 480px) { .cards, .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<main>
    <header>
        <div>
            <h1>System metrics</h1>
            <div class="intro">A recent view of Kubernetes health, Nginx traffic, and sampled Wordle latency.</div>
        </div>
        <nav><a href="/">Back to Wordle</a></nav>
    </header>
    <div id="status" class="status">Waiting for the first sample...</div>
    <section class="cards" aria-label="Current metrics">
        <div class="card"><span class="card-label">Sampled latency</span><strong id="latency-value" class="card-value">--</strong></div>
        <div class="card"><span class="card-label">Ready replicas</span><strong id="replica-value" class="card-value">--</strong></div>
        <div class="card"><span class="card-label">Nginx requests</span><strong id="request-value" class="card-value">--</strong></div>
        <div class="card"><span class="card-label">Pod restarts</span><strong id="restart-value" class="card-value">--</strong></div>
    </section>
    <section class="grid">
        <article class="chart-panel">
            <h2>Sampled latency</h2>
            <div class="chart-wrap"><canvas id="latency-chart"></canvas></div>
        </article>
        <article class="chart-panel">
            <h2>Wordle API replicas</h2>
            <div class="chart-wrap"><canvas id="replica-chart"></canvas></div>
        </article>
        <article class="events">
            <h2>Control-plane events</h2>
            <ul id="event-list"><li class="empty">No events recorded yet.</li></ul>
        </article>
    </section>
</main>
</body>
</html>
