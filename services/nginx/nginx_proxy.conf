upstream wordle-api {
    least_conn;
    server wordle-api-service:8080;
}

server {
    listen 8080;

    location = / {
        return 200 "Hello! You've reached the root endpoint";
    }

    location /wordle {
        proxy_pass http://wordle-api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}