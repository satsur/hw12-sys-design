upstream wordle-api {
    least_conn;
    server wordle-api-service:8080;
}

upstream web {
    server web-service:8080;
}

upstream control-plane {
    server control-plane-service:5000;
}

server {
    listen 8080;

    location /health {
        add_header Content-Type text/plain;
        return 200 'Healthy';
    }

    location = /nginx_status {
        stub_status;
        access_log off;
    }

    location /api/ {
        proxy_pass http://control-plane;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /metrics {
        proxy_pass http://web/metrics.html;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # https://www.getpagespeed.com/server-setup/nginx/nginx-reverse-proxy
    location / {
        proxy_pass http://web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
    }

    location /wordle {
        proxy_pass http://wordle-api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}